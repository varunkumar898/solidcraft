name: Golden trace (diagnostic)

# Diagnostic only: runs the robustness seeds with the boolean/measurement/heal
# trace hook on (crates/kernel/src/diag_trace.rs; off unless
# SOLIDCRAFT_TRACE_BOOLEANS=1) and uploads the trace files so the platforms can
# be diffed line by line. Deliberately separate from ci.yml; delete with the
# instrumentation.

on:
  workflow_dispatch:
  push:
    branches: [diag/golden-trace]
    paths:
      - "crates/kernel/**"
      - "crates/engine/**"
      - "crates/doc/**"
      - "crates/sketch/**"
      - ".github/workflows/golden-trace.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: golden-trace
          save-if: false
      - name: Commit the trace runs on
        run: git rev-parse HEAD | tee COMMIT_SHA.txt
      - name: Trace seed 13
        if: always()
        env:
          SOLIDCRAFT_TRACE_BOOLEANS: "1"
          SOLIDCRAFT_TRACE_OUT: ${{ github.workspace }}/trace_x86_64_seed13.txt
        run: cargo test -p solidcraft-engine --lib "tests::robustness_goldens::seed_13" -- --nocapture
      - name: Trace seed 67
        if: always()
        env:
          SOLIDCRAFT_TRACE_BOOLEANS: "1"
          SOLIDCRAFT_TRACE_OUT: ${{ github.workspace }}/trace_x86_64_seed67.txt
        run: cargo test -p solidcraft-engine --lib "tests::robustness_goldens::seed_67" -- --nocapture
      - name: SHA-256 of the traces
        if: always()
        run: sha256sum "${{ github.workspace }}/trace_x86_64_seed13.txt" "${{ github.workspace }}/trace_x86_64_seed67.txt" | tee "${{ github.workspace }}/trace_sha256.txt"
      - name: Upload seed 13 trace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trace-x86-64-seed13
          path: |
            ${{ github.workspace }}/trace_x86_64_seed13.txt
            ${{ github.workspace }}/COMMIT_SHA.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload seed 67 trace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trace-x86-64-seed67
          path: |
            ${{ github.workspace }}/trace_x86_64_seed67.txt
            ${{ github.workspace }}/COMMIT_SHA.txt
          if-no-files-found: error
          retention-days: 7
