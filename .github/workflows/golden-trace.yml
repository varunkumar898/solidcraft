name: Golden trace (manual, diagnostic)
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed to trace (13 or 67)"
        required: true
        default: "13"
        type: choice
        options: ["13", "67"]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: golden-trace
          save-if: false
      - name: Run traced seed
        env:
          SOLIDCRAFT_TRACE_BOOLEANS: "1"
          SOLIDCRAFT_TRACE_OUT: trace_x86_64_seed${{ inputs.seed }}.txt
        run: |
          cargo test -p solidcraft-engine --lib debug_seed_${{ inputs.seed }}_steps -- --nocapture
      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: trace-x86-64-seed${{ inputs.seed }}
          path: trace_x86_64_seed${{ inputs.seed }}.txt
          retention-days: 7